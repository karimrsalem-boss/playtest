<script>
"use strict";
/* ===== Strings: every user-visible word lives here ===== */
const STR = {
  title: 'Inkwake Relay', play: 'Play', boats: 'Boats', atlas: "Captain's Atlas",
  hint1: 'Drag to steer your boat (keys: arrows or A/Q and D, P pauses)', hint2: 'Sail beside a lantern boat for 1 s to pass the spark',
  pause: 'Paused', resume: 'Resume', quit: 'Quit', again: 'Sail again', back: 'Back',

  awMap: 'Most map', awAssist: 'Best assist', awRelay: 'Longest relay', awSave: 'Last-second save',
  goldAd: 'Gold ink postcard', atlasNote: 'Latest 24 postcards', goldEarned: 'First place: your postcard gets a gold border!',
  adNone: 'Ad unavailable, try again in a moment', skipTips: 'Skip tips', slow: 'Slow water!', relayPop: 'Relay', pts: 'pts',
  mapLbl: 'Map', diffLbl: 'Bots', mix: 'Mix', maps: ['Isles', 'Lanes', 'Atoll'], diffs: ['Easy', 'Normal'],
  sets: ['Harbour', 'Hills', 'Shore'], mute: 'Sound off', unmute: 'Sound on', stayClose: 'Stay close!',
  empty: 'No postcards yet', cells: 'Cells', lms: 'Landmarks', assists: 'Assists', relay: 'Relay',
  menu: 'Menu', fogLifts: 'The fog lifts…', goalInk: 'Ink the fog map and find the landmarks!',
  goalHold: 'Pass the spark: sail beside a boat!', goalChain: 'Relay going – keep inking!', goalWatch: 'Ink the map – help the lantern boat!',
  sec: 's', cellsWord: 'cells', links: 'boats', postcard: 'Postcard',
  animals: [
    { n: 'Fox' }, { n: 'Duck' }, { n: 'Bear' }, { n: 'Frog' },
    { n: 'Cat' }, { n: 'Owl' }, { n: 'Pig' }, { n: 'Panda' }
  ]
};

/* ===== Icons: small inline SVGs in the same ink-and-parchment style as the canvas art (no emoji, same look on every device) ===== */
const ICONS = {
  boat: '<path d="M3 15h18l-3 5H6z" fill="#ff6f59"/><path d="M12 3v11H6z" fill="#fff6dc"/><path d="M13 6v8h5z" fill="#1fa6a0"/>',
  fog: '<path d="M7 18a4 4 0 010-8 5 5 0 019.5-1A3.5 3.5 0 0117 18z" fill="#e8e0cc"/>',
  map: '<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="#f6ecd2"/><path d="M9 4v14M15 6v14"/>',
  hand: '<path d="M10 3.5a1.6 1.6 0 013.2 0V11h1.6a2.2 2.2 0 012.2 2.2V15a5.5 5.5 0 01-5.5 5.5h-.6a5 5 0 01-4-2L5 14.5l1.4-1.2L10 15.5z" fill="#fff6dc"/>',
  lantern: '<path d="M9 3h6M12 3v2M9 21h6"/><rect x="7" y="5" width="10" height="14" rx="4.5" fill="#ffd23a"/>',
  link: '<circle cx="8.5" cy="12" r="4.5" fill="#f6ecd2"/><circle cx="15.5" cy="12" r="4.5" fill="none"/>',
  assist: '<circle cx="7" cy="12" r="3.8" fill="#1fa6a0"/><circle cx="17" cy="12" r="3.8" fill="#ff6f59"/><path d="M10.8 12h2.4"/>',
  clock: '<circle cx="12" cy="13.5" r="8" fill="#fff6dc"/><path d="M12 8.5v5l3 2M10 3h4"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z" fill="#f4b400"/>',
  book: '<path d="M4 5h6.5a1.5 1.5 0 011.5 1.5V19a3 3 0 00-3-1H4zM20 5h-6.5A1.5 1.5 0 0012 6.5V19a3 3 0 013-1h5z" fill="#f6ecd2"/>',
  home: '<path d="M3 12l9-8 9 8M6 10v10h12V10" fill="#f6ecd2"/>',
  on: '<path d="M4 9h4l5-4v14l-5-4H4z" fill="#f6ecd2"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/>',
  off: '<path d="M4 9h4l5-4v14l-5-4H4z" fill="#f6ecd2"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>',
  play: '<path d="M7 4.5l12 7.5-12 7.5z" fill="currentColor"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  pause: '<path d="M8.5 5v14M15.5 5v14" stroke-width="3.6"/>'
};
function ic(n, size) {
  return '<svg class="ic" data-ic="' + n + '" viewBox="0 0 24 24" width="' + (size || '1.2em') + '" height="' + (size || '1.2em') + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
}

/* ===== Config ===== */
const W = 48, H = 72;                     // coarse grid cells (not pixels): keeps multiplayer sync simple
const CFG = {
  ROUND: 180, EASY_SPEED: .72, GUIDED_ROUND: 90, GUIDED_CAP: 120, SKIP_LEFT: 60, FREEPLAY: 15, STEP: 1 / 30, SPEED: 4.2, TURN: 2.6, INK_R: 1.8,
  LM_R: 3.2, LM_PTS: 25, ASSIST_PTS: 10, CHAIN_PTS: 2, CHAIN_CAP: 16, DISCOVER_R: 9,
  SPARK_TTL: 14, SPARK_GAP: 55, ALONG: 2.8, PASS_TIME: 1, SAVE_MARGIN: 5,
  GIANT_R: 5, GIANT_SLOW: 0.45
};
const INK = ['#1fa6a0', '#ff6f59', '#f4b400', '#8e4585', '#3b78c4', '#5da13f', '#e0709e', '#5a6b7b'];
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const INKRGB = INK.map(hex);
const FUR = ['#e8803a', '#ffd84a', '#a8714a', '#7cc255', '#b9b3a8', '#8c6b4f', '#f6a9b8', '#f4f4f0'];
const EARS = ['point', 'beak', 'round', 'eyes', 'point', 'tuft', 'round', 'round'];

/* ===== Helpers ===== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const fmtTime = t => { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

/* ===== Map generation (round hand-sketched islands) ===== */
/* layout 0 = Isles (scattered), 1 = Lanes (staggered rows, channels between), 2 = Atoll (ring of islands round a lagoon);
   lmSet 0..2 picks which three landmark drawings are used this round. */
function genMap(seed, layout = 0, lmSet = 0) {
  const r = mulberry32(seed);
  const land = new Uint8Array(W * H);
  const centers = [];
  const addIsland = (cx, cy, spread, size) => {
    const blobs = 3 + (r() * 3 | 0);
    for (let k = 0; k < blobs; k++) {
      const a = r() * 6.283, d = r() * 4.5 * spread;
      const bx = cx + Math.cos(a) * d, by = cy + Math.sin(a) * d, br = (2.5 + r() * 3.2) * size;
      const p1 = r() * 6.283, p2 = r() * 6.283;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const dx = x + .5 - bx, dy = y + .5 - by;
        if (Math.abs(dx) > br * 1.5 || Math.abs(dy) > br * 1.5) continue;
        const ang = Math.atan2(dy, dx);
        const rr = br * (1 + .2 * Math.sin(ang * 3 + p1) + .1 * Math.sin(ang * 5 + p2));
        if (Math.hypot(dx, dy) < rr) land[y * W + x] = 1;
      }
    }
  };
  if (layout === 1) {
    [[12, 9], [34, 9], [23, 22], [12, 35], [34, 35], [23, 48]].forEach(c => { const cx = c[0] + (r() - .5) * 3, cy = c[1] + (r() - .5) * 3; centers.push([cx, cy]); addIsland(cx, cy, .6, .85); });
  } else if (layout === 2) {
    const ph = r() * 6.283;
    for (let k = 0; k < 5; k++) { const a = ph + k * 6.283 / 5, cx = 24 + Math.cos(a) * 14, cy = 30 + Math.sin(a) * 17; centers.push([cx, cy]); addIsland(cx, cy, .6, .9); }
    if (r() < .5) { centers.push([24, 30]); addIsland(24, 30, .4, .6); }
  } else {
    const want = 6 + (r() * 3 | 0);
    for (let tries = 0; centers.length < want && tries < 300; tries++) {
      const cx = 8 + r() * (W - 16), cy = 8 + r() * (H - 28);
      if (centers.some(c => Math.hypot(c[0] - cx, c[1] - cy) < 13)) continue;
      centers.push([cx, cy]);
      addIsland(cx, cy, 1, 1);
    }
  }
  for (let y = H - 12; y < H; y++) for (let x = 0; x < W; x++) land[y * W + x] = 0; // harbour waters
  const L = (x, y) => x < 0 || y < 0 || x >= W || y >= H ? 0 : land[y * W + x];
  const coast = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    if (land[y * W + x] && (!L(x + 1, y) || !L(x - 1, y) || !L(x, y + 1) || !L(x, y - 1))) coast[y * W + x] = 1;
  // water reachable from the harbour
  const reach = new Uint8Array(W * H), q = [(H - 3) * W + 24]; reach[q[0]] = 1;
  while (q.length) {
    const i = q.pop(), x = i % W, y = i / W | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = ny * W + nx;
      if (!land[j] && !reach[j]) { reach[j] = 1; q.push(j); }
    }
  }
  const nearReach = (x, y) => { for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < W && ny < H && reach[ny * W + nx]) return true; } return false; };
  const cand = [];
  for (let y = 3; y < H - 14; y++) for (let x = 3; x < W - 3; x++) if (coast[y * W + x] && nearReach(x, y)) cand.push([x + .5, y + .5]);
  const lms = [];
  for (let k = 0; k < 400 && lms.length < 6 && cand.length; k++) {
    const c = cand[r() * cand.length | 0];
    if (lms.every(l => Math.hypot(l.x - c[0], l.y - c[1]) > 11)) lms.push({ x: c[0], y: c[1], type: lmSet * 3 + lms.length % 3, by: -1 });
  }
  const giants = [];
  for (let k = 0; k < 600 && giants.length < 4; k++) {
    const x = 4 + r() * (W - 8), y = 4 + r() * (H - 8);
    if (!reach[(y | 0) * W + (x | 0)] || Math.hypot(x - 24, y - 69) < 16) continue;
    if (giants.some(g => Math.hypot(g.x - x, g.y - y) < 12)) continue;
    giants.push({ x, y, kind: giants.length % 2 ? 'turtle' : 'whale', ph: r() * 6 });
  }
  const noise = new Uint8Array(W * H); for (let i = 0; i < noise.length; i++) noise[i] = r() * 256;
  let inkable = 0; // cells a boat can actually colour (goal bar denominator)
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (nearReach(x, y)) inkable++;

/* ===== Simulation (no DOM; a network layer can drive it in v2) ===== */
function score(b) { return b.cells + b.lms * CFG.LM_PTS + b.assists * CFG.ASSIST_PTS + b.relayPts; }

/* Controller interface: desired(boat, sim, dt) -> heading in radians, or null to keep course.

function makeSim(n, seed, o = {}) {

    seed, t: 0, len: o.len || CFG.ROUND, layout: o.layout || 0, lmSet: o.lmSet || 0, map: genMap(seed, o.layout || 0, o.lmSet || 0), owner: new Uint8Array(W * H), inked: 0, boats: [],
    spark: null, sparkIdle: 0, passes: [], chains: [], events: [], done: false, dirty: true, guided: false
  };
  for (let i = 0; i < n; i++) {
    s.boats.push({
      id: i, name: STR.animals[i].n, color: INK[i], x: 24 + (i - (n - 1) / 2) * 3.4, y: 69, h: -Math.PI / 2,
      cells: 0, lms: 0, assists: 0, relayPts: 0, slow: 1, speed: 1, blocked: false, trail: [], trailT: 0, ctrl: null
    });

}
function escSide(s, b) {                              // which way to turn to face the most open water (+1 / -1)
  let p = 0, m = 0;
  for (let k = 1; k <= 8; k++) for (const d of [2, 4, 6]) {
    if (isWater(s, b.x + Math.cos(b.h + k * .2) * d, b.y + Math.sin(b.h + k * .2) * d)) p += 1 / k;
    if (isWater(s, b.x + Math.cos(b.h - k * .2) * d, b.y + Math.sin(b.h - k * .2) * d)) m += 1 / k;

  if (Math.abs(dx) > L && isWater(s, nx, b.y)) { b.x = nx; return; }

/* ===== Bots (stand in for remote players in v1) ===== */
function BotCtrl(skill, seed, diff = 1) {   // diff 0 = easy (slower, less keen, readier to help), 1 = normal
  const r = mulberry32(seed);

  if (diff === 0) skill *= .4;
  let target = null, retarget = 0, lastSpark = null, help = true;
  const known = new Set();                // landmarks this bot has discovered by sailing close (it is never told where they are)
  const unrev = (s, x, y) => {
    let c = 0;
    for (let dy = -4; dy <= 4; dy += 2) for (let dx = -4; dx <= 4; dx += 2) {
      const nx = (x + dx) | 0, ny = (y + dy) | 0;

  const avoid = (b, s, ang) => {

    for (const useG of [true, false]) for (const o of offs) {
      const a = ang + o; let ok = true;
      for (const d of [1.5, 3, 5]) {
        const px = b.x + Math.cos(a) * d, py = b.y + Math.sin(a) * d;
        if (!isWater(s, px, py) || (useG && nearGiant(s, px, py) && !nearGiant(s, b.x, b.y))) { ok = false; break; }
      }
      if (ok) return a;
    }
    return ang + Math.PI * .8;
  };
  return {
    desired(b, s, dt) {
      retarget -= dt;
      const sp = s.spark;
      for (const lm of s.map.lms) if (lm.by < 0 && !known.has(lm) && Math.hypot(lm.x - b.x, lm.y - b.y) < CFG.DISCOVER_R) { known.add(lm); retarget = 0; }

      let pace = null;
      if (sp) {
        const holder = s.boats[sp.holder];
        if (holder === b) {
          let bd = 1e9;
          for (const o of s.boats) if (!sp.chain.includes(o.id)) { const d = dist(o, b); if (d < bd) { bd = d; pace = o; } }
          if (sp.ttl < 2 || (!s.guided && !help)) pace = null; // a bot holder only sometimes goes looking for a partner
        } else if (help && !sp.chain.includes(b.id) && sp.ttl > 5 && dist(b, holder) < (s.guided ? 80 : 28)) pace = holder;
      }
      if (pace) { // close in, then match course and sail alongside

        for (let k = 0; k < N; k++) {

          const d = Math.hypot(x - b.x, y - b.y);

          if (sc > bs) { bs = sc; best = { x, y }; }
        }
        for (const lm of known) if (lm.by < 0) {
          const d = Math.hypot(lm.x - b.x, lm.y - b.y);
          if (d < 30 && r() < .6 * skill + .2 && 60 - d * .8 > bs) { bs = 60 - d * .8; best = { x: lm.x, y: lm.y }; }
        }
        target = best || { x: 24, y: 30 };
      }
      return avoid(b, s, Math.atan2(target.y - b.y, target.x - b.x));
    }
  };
}

  }
  if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyQ') { if (!input.L && state === 'play') Snd.sfx('steer'); input.L = 1; }
  else if (c === 'ArrowRight' || c === 'KeyD') { if (!input.R && state === 'play') Snd.sfx('steer'); input.R = 1; }
  if (state === 'play' && (input.L || input.R) && sim) { const me = sim.boats[0]; rings.push({ x: ox + me.x * cs, y: oy + me.y * cs, age: 0, life: .4, color: '#fff6dc' }); }
  else if (c === 'KeyP') { if (state === 'play') setState('pause'); else if (state === 'pause') setState('play'); }
  if (c.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyQ') input.L = 0;
  else if (c === 'ArrowRight' || c === 'KeyD') input.R = 0;
});
document.addEventListener('visibilitychange', () => {
  Snd.hidden(document.hidden);
  if (document.hidden) { resetInput(); if (state === 'play') setState('pause'); }
  else if (!looping) { looping = true; last = performance.now(); requestAnimationFrame(frame); }
});

function newPreview() { sim = makeSim(nBoats, (Math.random() * 2 ** 31) | 0); sim.boats.forEach(b => b.ctrl = LocalCtrl); countdown = 0; fogLift = 0; }

/* --- main loop --- */
let last = performance.now(), looping = true, loaded = false;
function compact(arr, keep) { let j = 0; for (let i = 0; i < arr.length; i++) if (keep(arr[i])) arr[j++] = arr[i]; arr.length = j; } // in place: no per-frame array allocation
const fxAlive = f => f.age < 1.4, partAlive = p => p.age < p.life, arcAlive = a => a.age < 1.7, ringAlive = r => r.age < r.life;
function frame(now) {
  if (document.hidden) { looping = false; return; } // loop sleeps while the tab is hidden; visibilitychange wakes it
  if (!loaded) { loaded = true; show('loading', false); Portal.loadingStop(); }   // first frame is ready: lift the loading screen
  const dt = Math.min(.1, (now - last) / 1000); last = now; clock += dt;
  for (let i = 0; i < fx.length; i++) fx[i].age += dt; compact(fx, fxAlive);
  if (bellT > 0) bellT -= dt;
  for (let i = 0; i < parts.length; i++) { const p = parts[i]; p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt; }
  compact(parts, partAlive);
  for (let i = 0; i < rings.length; i++) rings[i].age += dt; compact(rings, ringAlive);
  for (let i = 0; i < arcs.length; i++) arcs[i].age += dt; compact(arcs, arcAlive);
  if (tutFlash > 0) tutFlash -= dt;
  if (sim) for (const b of sim.boats) if (b.pop > 0) b.pop = Math.max(0, b.pop - dt * 2.5);
  if (state === 'play' && sim) {
    if (countdown > 0) countdown -= dt;
    else {
      accum += dt;
      while (accum >= CFG.STEP && state === 'play') { step(sim, CFG.STEP); accum -= CFG.STEP; drainEvents(sim); tutTick(CFG.STEP); }
      const me = sim.boats[0];
      if (me.cells >= lastCells + 5) { lastCells = me.cells; burst(ox + me.x * cs, oy + me.y * cs, me.color, 3, 60); } // ink splash
    }
    if (state === 'play') updateHud();
  }
  if (state === 'fog') {
    fogT += dt; fogLift = Math.min(1, fogLift + dt / 2);
    if (Math.random() < .5) burst(ox + Math.random() * W * cs, oy + Math.random() * H * cs * .6, ['#ffd23a', '#ff6f59', '#1fa6a0', '#8e4585'][Math.random() * 4 | 0], 2, 90);
    updateHud();
    if (fogT >= FOG_SHOW) enterParade();
  }
  if (state === 'parade') fogLift = 1;
  draw();
  requestAnimationFrame(frame);
}
newPreview(); setState('title');
requestAnimationFrame(frame);
</script>
