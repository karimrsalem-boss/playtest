<!DOCTYPE html>
<html lang="en">
<head>

<title>Kitewind Workshop</title>
<style>
:root{--teal:#2f8f8b;--teal2:#1f6d6a;--sand:#e9c98f;--coral:#f08a6b;--coral2:#d0694a;--cream:#fbf3e0;--paper:#f6e9cc;--ink:#3b3a36;--soft:#8a8372}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1f6d6a;color:var(--ink);font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;overscroll-behavior:none}
#app{max-width:520px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--cream);position:relative;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--teal);color:var(--cream);font-weight:bold;flex:0 0 auto}
header .title{font-size:15px;letter-spacing:.5px}
header .cur{display:flex;gap:12px;font-size:16px}
header .cur{align-items:center}
.mute{width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin:-6px -8px -6px 0}
header .cur span{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.15);padding:3px 10px;border-radius:14px}
main{flex:1 1 auto;overflow-y:auto;padding:12px 12px 16px;-webkit-overflow-scrolling:touch}
nav{display:flex;flex:0 0 auto;background:var(--paper);border-top:3px dashed var(--sand);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:6px 2px 5px;font:inherit;font-weight:bold;font-size:13px;color:var(--soft);min-height:60px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav button canvas{width:30px;height:30px}
nav button .dot,.dot{position:absolute;top:5px;right:calc(50% - 24px);width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid #fff;animation:dotp 1.2s ease-in-out infinite}
@keyframes dotp{50%{transform:scale(1.35)}}
nav button.on{color:var(--coral2);box-shadow:inset 0 -4px 0 var(--coral)}
.card{background:var(--paper);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 3px 0 var(--sand);border:2px dashed var(--sand)}
canvas{display:block;max-width:100%}
.scene{width:100%;border-radius:14px;box-shadow:0 3px 0 var(--sand);aspect-ratio:9/5.5;background:#bfe9e4}
button.btn{font:inherit;font-weight:bold;border:0;border-radius:12px;padding:12px 16px;min-height:48px;background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral2);cursor:pointer;font-size:16px}
button.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral2)}
button.btn.teal{background:var(--teal);box-shadow:0 4px 0 var(--teal2)}
button.btn:disabled{background:#cfc6b0;box-shadow:0 4px 0 #b3aa93;color:#f3eddc;cursor:default}
button.btn.big{width:100%;font-size:19px;padding:14px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.chip{flex:1;border:2px solid var(--sand);background:var(--cream);border-radius:12px;padding:10px 4px;font:inherit;font-weight:bold;min-height:48px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--teal);color:var(--cream);border-color:var(--teal2)}
.chip:disabled{opacity:.45;cursor:default}
.lbl{font-size:12px;font-weight:bold;color:var(--soft);text-transform:uppercase;letter-spacing:.8px;margin:2px 0 6px}
.bar{height:14px;border-radius:8px;background:#e5d9bb;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:8px}
.bar i.warn{background:var(--coral)}
.mark{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink)}
.stat{display:flex;justify-content:space-between;font-weight:bold;margin:4px 0}
.line{display:flex;align-items:center;justify-content:center;gap:2px}
.slot{width:64px;height:78px;border:2px solid var(--sand);border-radius:12px;background:var(--cream);position:relative;padding:0;cursor:pointer;font:inherit}
.slot.sel{border-color:var(--coral);box-shadow:0 0 0 3px rgba(240,138,107,.35)}
.slot.empty{border-style:dashed;opacity:.6;cursor:default}
.slot canvas{margin:2px auto 0}
.slot b{position:absolute;bottom:2px;left:0;right:0;font-size:12px;color:var(--ink)}
.arrow{font-size:20px;color:#c9bd9d;font-weight:bold;width:14px;text-align:center}
.arrow.lit{color:var(--teal)}
.sw{border:3px solid transparent;border-radius:12px;background:var(--cream);padding:2px;cursor:pointer;position:relative;min-width:56px;min-height:56px}
.sw.on{border-color:var(--coral)}
.sw.lock{opacity:.5}
.sw small{position:absolute;bottom:0;right:2px;font-size:11px;font-weight:bold;background:var(--paper);border-radius:6px;padding:0 3px}
.helper{position:relative;flex:0 0 auto}
.bubble{position:absolute;top:-4px;right:-8px;background:#fff;border:2px solid var(--coral);color:var(--coral2);border-radius:12px;padding:0 6px;font-weight:bold;font-size:14px}
.small{font-size:13px;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumb{border:0;padding:0;background:none;cursor:pointer;border-radius:6px;overflow:hidden;box-shadow:0 2px 0 var(--sand)}
.thumb canvas{width:100%;height:auto}
#modal{position:absolute;inset:0;background:rgba(31,109,106,.88);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#modal.on{display:flex}
.sheet{background:var(--cream);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:100%;overflow:auto;text-align:center;border:3px dashed var(--sand)}
.sheet canvas{margin:0 auto 10px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.25);width:100%;height:auto}
.env{width:200px;height:130px;margin:20px auto;background:var(--coral);border-radius:8px;position:relative;box-shadow:0 5px 0 var(--coral2);animation:bob 1.6s ease-in-out infinite}
.env:before{content:"";position:absolute;left:0;right:0;top:0;height:0;border-left:100px solid transparent;border-right:100px solid transparent;border-top:70px solid #f6a88f}
.env:after{content:"";position:absolute;left:50%;top:50px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--cream)}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.pop{animation:pop .45s ease-out}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.tag{display:inline-block;background:var(--coral);color:#fff;font-weight:bold;padding:2px 10px;border-radius:10px;margin:4px 0}
.tag.t{background:var(--teal)}
.tabhead{display:flex;align-items:center;gap:10px;margin-bottom:8px;min-height:60px}
.tabhead canvas{width:56px;height:56px;flex:0 0 auto;background:var(--paper);border-radius:14px;border:2px solid var(--sand)}
.tabhead b{font-size:17px}
.strip{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 14px;border:0;width:100%;font:inherit;font-weight:bold;font-size:14px;background:#e3f2ef;color:var(--teal2);cursor:pointer;text-align:left}
.strip.mail{background:var(--coral);color:#fff}
.strip .bar{flex:1;height:10px}
.hint{position:relative;z-index:3;animation:hintpulse 1s ease-in-out infinite}
.hint::after{content:"";position:absolute;left:50%;top:-24px;margin-left:-12px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:18px solid var(--coral2);filter:drop-shadow(0 2px 0 #fff);animation:hintbob .8s ease-in-out infinite;pointer-events:none}
@keyframes hintpulse{50%{box-shadow:0 0 0 7px rgba(240,138,107,.55);transform:scale(1.04)}}
@keyframes hintbob{50%{transform:translateY(7px)}}
.bar i.pulsebar{animation:barpulse 1s ease-in-out infinite}
@keyframes barpulse{50%{box-shadow:0 0 0 4px rgba(240,138,107,.7);filter:brightness(1.25)}}
.nudge{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 4px 0 var(--coral2),0 0 0 5px rgba(240,138,107,.35)}}
.pop2{animation:pop2 .28s ease-out}
@keyframes pop2{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
#loading{position:absolute;inset:0;z-index:20;background:var(--teal);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:bold;font-size:18px;transition:opacity .35s}
#loading.done{opacity:0;pointer-events:none}
.ldkite{width:44px;height:44px;background:var(--coral);transform:rotate(45deg);border-radius:4px;animation:ldb 1.2s ease-in-out infinite}
@keyframes ldb{50%{transform:rotate(45deg) translate(-8px,-8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
#fx i{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;animation:fly .8s ease-out forwards}
#fx i:nth-child(3n){border-radius:2px;transform:rotate(30deg)}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.thumb.new{animation:hintpulse 1s ease-in-out 3;outline:3px solid var(--coral)}
.okmark{font-size:26px;font-weight:bold;color:var(--teal2);margin:4px 0}
#howto{position:absolute;left:8px;right:8px;top:56px;z-index:4;pointer-events:none}
#howto .how{pointer-events:auto;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--coral);border-radius:12px;padding:6px 6px 6px 12px;font-weight:bold;font-size:14px;box-shadow:0 3px 0 var(--coral2)}
#howto .how span{flex:1}
#howto .how button{font:inherit;font-weight:bold;min-width:56px;min-height:44px;border:0;border-radius:10px;background:var(--teal);color:#fff;cursor:pointer}
.goal{display:flex;justify-content:space-between;font-weight:bold;margin:0 0 6px}
</style>
</head>
<body>
<div id="app">
  <header><div class="title" id="ttl"></div><div class="cur" id="cur"></div></header>
  <div id="strip"></div>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div id="howto"></div>
  <div id="modal"></div>
  <div id="fx"></div>
  <div id="loading" role="status" aria-live="polite"><div class="ldkite"></div><div id="ldtxt">Loading…</div></div>
</div>
<script>
"use strict";
/* ============================================================
   Kitewind Workshop — v1 prototype. One file, no network, no assets.
   Part 1: strings + data + pure game logic (testable without a DOM)
   Part 2: drawing (canvas)   Part 3: UI
   ============================================================ */

/* ---- All UI words live here (the only text that needs translating) ---- */
const STR = {
  title: "Kitewind Workshop",
  howto: "Tap the glowing button to play. Keys: 1-4 tabs, Enter = go.", skip: "Skip",
  tabs: ["Sky", "Workshop", "Kite", "Atlas"],
  seeds: "Seeds", threads: "Threads",
  tailwind: "Find an extra postcard", tailwindDone: "Extra postcard found!",
  launch: "Launch", flying: "Flying", home: "Home in", hours: "h",
  mail: "Mail!", open: "Open", next: "Next", done: "Done", isNew: "New!",
  duplicate: "Seeds instead", early: "Home early", small: "Small postcard",
  speed: "Speed", range: "Range", need: "Needed", flow: "Flow",
  upgrade: "Upgrade", buy: "Buy", max: "Max", moveL: "Left", moveR: "Right",
  level: "Lv", string: "String", locked: "Locked", reach: "String Lv",
  benches: "Side benches", rooms2: "Workshop rooms", decor: "Decorations", build: "Build", owned: "Built",
  benchNames: { spool: "Spool rack", compass: "Compass table" },
  benchNote: { spool: "Kites come home sooner", compass: "Flights bring more seeds" },
  roomNames: { loft: "Drying loft", mailroom: "Mail room" },
  roomNote: { loft: "Neighbouring stations help more", mailroom: "Kites need less speed" },
  decorNames: ["Bunting", "Wind chimes", "Flower boxes", "Lantern string", "Shell garland", "Star lamp"],
  soundOff: "Sound off", soundOn: "Sound on",
  alt: { scene: "Your workshop by the sea", atlas: "Wind Atlas map", card: "Postcard", blank: "Postcard not found yet", kite: "Kite", helper: "Helper" },
  shape: "Shape", cloth: "Cloth", pattern: "Pattern", tail: "Tail",
  room: "Room", newRoom: "New room", newShape: "New kite shape",
  gained: "Gained", season: "Winter set", atlasDone: "Wind Atlas complete!",
  sendOff: "Choose how long the kite flies.", pick: "Region",
  stations: { spinner: "Spinner", loom: "Loom", paint: "Paint table", vane: "Wind vane" },
  regionNames: ["Gull Cove", "Tortoise Shallows", "Hedgehog Hollow", "Coral Ridge"],
  rooms: ["Loft", "Dye room", "Chart room", "Lantern room"],
  seasons: { dec: "Winter" },
  purpose: ["Send your kite flying", "Make your kite faster", "Design your kite", "Collect your postcards"],
  welcome: "Welcome!", welcomeNote: "Your workshop is ready. Make a kite and send it flying!", start: "Let's go",
  firstNote: "Your first flight takes just 20 seconds.", min: "min", goal: "Bring home a postcard",
  waitNote: "Your kite is out on the wind", mailWaiting: "Postcard is home!", flightStrip: "Kite flying",
  nextFlight: "Next flight", seeKite: "See the kite", openPost: "Open postcard", flyIt: "Fly it!",
  newTile: "New tile in your atlas!", earn: "Fly the kite to earn more", suggest: "Try this one",
  nice: "Nice!", whileWait: "While you wait:"
};

/* ---- Data ---- */
const FLOW = ["spinner", "loom", "paint", "vane"];       // a neighbour pair in this order adds Flow
const FLOW_BONUS = 0.2;
const STATION_MAX = 8, STRING_MAX = 4, CARDS_PER_REGION = 12;
const VANE_COST = 50;
const STRING_COST = [null, [40, 2], [130, 6], [320, 12]]; // index = current level -> cost to go up
const HOURS = [1, 4, 8];
const REQ = { 1: 2, 4: 5, 8: 9 };                        // power needed at region tier 1
const REGION_NEED = [1, 1.6, 2.4, 3.4];                  // v4 balance: later regions need real investment, not just a little more
const CARDS_BY_HOURS = { 1: 1, 4: 1, 8: 2 };
const THREADS_BY_HOURS = { 1: 0, 4: 1, 8: 3 };
const PATTERN_COST = [0, 0, 2, 4, 6];                    // threads
const DUP_SEEDS = 6;
const MS_H = 3600000;
const FIRST_MS = 20000;                                 // the very first flight only
const WELCOME_SEEDS = 10, FIRST_SEEDS = 10;

/* v4: side benches (real effects), two more rooms (real effects), cosmetic decorations (a seed sink) */
const BENCH_MAX = 5;
const BENCH = {                                          // cost to reach level i+1 from level i (seeds)
  spool: { cost: [90, 140, 210, 320, 450], time: 0.04 },        // each level: flights come home 4% sooner
  compass: { cost: [130, 200, 290, 410, 570], seeds: 0.06 }    // each level: +6% seeds from flights
};
const BENCH_KEYS = ["spool", "compass"];
const ROOMS2 = {
  loft: { seeds: 120, threads: 2, flow: 0.1 },               // Flow bonus per pair 20% -> 30%
  mailroom: { seeds: 200, threads: 4, need: 0.9 }            // speed needed x0.9
};
const ROOM_KEYS = ["loft", "mailroom"];
const DECOR_COST = [50, 100, 170, 260, 380, 520];
const MAX_FLIGHT_MS = 8 * MS_H;
const CLOCK_SLACK = 5 * 60000;

const REGIONS = [
  { tier: 1, pal: { sky: ["#bfe9e4", "#f6e3c0"], ground: "#e9c98f", acc: "#f08a6b", deep: "#2f8f8b" } },
  { tier: 2, pal: { sky: ["#a9dcd8", "#f9dcc0"], ground: "#d9bd7f", acc: "#e56f5a", deep: "#237a77" } },
  { tier: 3, pal: { sky: ["#f9d5b8", "#fbeacb"], ground: "#d3a76b", acc: "#2f8f8b", deep: "#a65b43" } },
  { tier: 4, pal: { sky: ["#f6b79e", "#fde8c8"], ground: "#c98e6a", acc: "#2f8f8b", deep: "#7b3f3a" } }
];
const SHAPES = [
  [[0, -1.1], [.7, -.1], [0, 1], [-.7, -.1]],
  [[0, -1], [.95, .8], [0, .4], [-.95, .8]],
  [[0, -1], [.85, -.5], [.85, .5], [0, 1], [-.85, .5], [-.85, -.5]],
  [[0, -1], [.8, .1], [.6, 1], [0, .55], [-.6, 1], [-.8, .1]]
];
const CLOTHS = [["#f08a6b", "#fbf3e0"], ["#2f8f8b", "#fbf3e0"], ["#e9c98f", "#f08a6b"], ["#6aa5c9", "#fbf3e0"], ["#8d6fb0", "#e9c98f"]];
const TAILS = ["#f08a6b", "#2f8f8b", "#e9c98f", "#fbf3e0"];

/* Seasonal slot: a swappable cosmetic layer. Changes no balance. */
const SEASONS = [{
  id: "dec", month: 11, cards: 6,
  sky: ["#cfe3f0", "#fbeede"], snow: true,
  cloths: [["#c0392b", "#fbf3e0"], ["#1f6d6a", "#e9c98f"]],   // winter fabrics, appended to CLOTHS choices
  pal: { sky: ["#cfe3f0", "#fbeede"], ground: "#f4f7f8", acc: "#c0392b", deep: "#1f6d6a" }
}];

function activeSeason(now, force) {
  if (force) return SEASONS.find(s => s.id === force) || null;
  const m = new Date(now).getMonth();
  return SEASONS.find(s => s.month === m) || null;
}

/* ---- State ---- */
function newState(now, rng) {
  const s = {
    v: 2, seeds: 20, threads: 0, firstFlown: false,
    lvl: { spinner: 1, loom: 1, paint: 1, vane: 0 },
    line: ["spinner", "loom", "paint"],
    string: 1,
    cards: [[], [], [], []],
    seasonal: {},                       // id -> owned card indexes (kept across years)
    patterns: [0, 1],
    kite: { shape: 0, cloth: 0, pattern: 1, tail: 0 },
    bench: { spool: 0, compass: 0 }, rooms2: { loft: false, mailroom: false }, decor: 0, lastSeen: now,
    flight: null, lastHours: 1, lastRegion: 0
  };
  // Welcome mail: the first thing a new player sees is a letter (no postcard yet; the first flight brings it).
  s.flight = { start: now - MS_H, endAt: now, hours: 1, region: 0, weak: false, cards: [], season: [], seeds: WELCOME_SEEDS, threads: 0, welcome: true };
  return s;
}
function shuffle(a, rng) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const isNum = (n, lo, hi) => typeof n === "number" && isFinite(n) && n >= lo && n <= hi;
function sanitize(raw, now, rng) {
  const d = newState(now, rng);
  if (!raw || typeof raw !== "object" || raw.v !== 2) return d;
  const s = d; s.flight = null; s.firstFlown = !!raw.firstFlown;
  if (isNum(raw.seeds, 0, 1e9)) s.seeds = Math.floor(raw.seeds);
  if (isNum(raw.threads, 0, 1e9)) s.threads = Math.floor(raw.threads);
  if (raw.lvl) for (const k of FLOW) if (isNum(raw.lvl[k], k === "vane" ? 0 : 1, STATION_MAX)) s.lvl[k] = Math.floor(raw.lvl[k]);
  if (Array.isArray(raw.line)) {
    const l = raw.line.filter((k, i, a) => FLOW.includes(k) && a.indexOf(k) === i && s.lvl[k] > 0);
    if (l.length >= 3) s.line = l;
  }
  if (isNum(raw.string, 1, STRING_MAX)) s.string = Math.floor(raw.string);
  if (Array.isArray(raw.cards)) for (let r = 0; r < 4; r++) if (Array.isArray(raw.cards[r])) s.cards[r] = [...new Set(raw.cards[r].filter(i => Number.isInteger(i) && i >= 0 && i < CARDS_PER_REGION))];
  if (raw.seasonal && typeof raw.seasonal === "object") for (const se of SEASONS) if (Array.isArray(raw.seasonal[se.id])) s.seasonal[se.id] = [...new Set(raw.seasonal[se.id].filter(i => Number.isInteger(i) && i >= 0 && i < se.cards))];
  if (Array.isArray(raw.patterns)) s.patterns = [...new Set([0, 1, ...raw.patterns.filter(i => Number.isInteger(i) && i >= 0 && i < PATTERN_COST.length)])];
  const k = raw.kite || {};
  if (isNum(k.shape, 0, 3)) s.kite.shape = Math.floor(k.shape);
  if (isNum(k.cloth, 0, 6)) s.kite.cloth = Math.floor(k.cloth);
  if (isNum(k.pattern, 0, 4) && s.patterns.includes(k.pattern)) s.kite.pattern = k.pattern;
  if (isNum(k.tail, 0, 3)) s.kite.tail = Math.floor(k.tail);
  if (!shapesUnlocked(s).includes(s.kite.shape)) s.kite.shape = 0;
  if (isNum(raw.lastHours, 1, 8) && HOURS.includes(raw.lastHours)) s.lastHours = raw.lastHours;
  if (isNum(raw.lastRegion, 0, 3) && Math.floor(raw.lastRegion) <= s.string - 1) s.lastRegion = Math.floor(raw.lastRegion);
  if (raw.bench) for (const k of BENCH_KEYS) if (isNum(raw.bench[k], 0, BENCH_MAX)) s.bench[k] = Math.floor(raw.bench[k]);
  if (raw.rooms2) for (const k of ROOM_KEYS) s.rooms2[k] = raw.rooms2[k] === true;
  if (isNum(raw.decor, 0, DECOR_COST.length)) s.decor = Math.floor(raw.decor);
  if (isNum(raw.lastSeen, 0, 1e15)) s.lastSeen = raw.lastSeen;
  const f = raw.flight;
  if (f && isNum(f.start, 0, 1e15) && isNum(f.endAt, 0, 1e15) && f.endAt >= f.start && HOURS.includes(f.hours) && isNum(f.region, 0, 3) && Math.floor(f.region) <= s.string - 1 && Array.isArray(f.cards)) {
    s.flight = {
      start: f.start, endAt: Math.min(f.endAt, f.start + MAX_FLIGHT_MS), hours: f.hours, region: Math.floor(f.region), weak: !!f.weak,

/* ---- actions ---- */
function act(a, v, ev) {

  if (a === "skiphow") { ui.pop = null; hideHowto(); render(); return; }
  audio.sfx(a === "tab" ? "tab" : ["buy", "vane", "bench", "room", "decor", "string", "upg", "launch", "mailopen", "mailnext", "tailwind"].includes(a) ? "" : "tap");
  if (a === "tab") { ui.tab = +v; render(); return; }

  if (a === "hours") { ui.hours = +v; if (guide === "pick") setGuide("launch2"); render(); return; }
  if (a === "region") { ui.region = +v; ui.atlasRegion = +v; render(); return; }

  }

    return;
  }
  if (a === "openmail") { ui.modal = { stage: "env" }; render(); return; }
  if (a === "mailopen") {
    const res = collectFlight(st, now()); if (!res) { ui.modal = null; render(); return; }
    save(); audio.ding(); audio.sfx("card"); if (!res.welcome) PORTAL.levelCompleted(res);
    if (res.unlocked.length) PORTAL.happytime();
    const items = res.cards.map(c => ({ kind: "r", r: c.r, i: c.i, dup: c.dup })).concat(res.season.map(c => ({ kind: "s", r: 0, i: c.i, dup: c.dup })));

  if (dig && !ui.modal) { audio.sfx("tab"); ui.tab = +dig[1] - 1; render(); }
  else if ((c === "ArrowLeft" || c === "ArrowRight") && !ui.modal) { audio.sfx("tab"); ui.tab = (ui.tab + (c === "ArrowRight" ? 1 : 3)) % 4; render(); }
  else if ((c === "Enter" || c === "NumpadEnter" || c === "Space") && !(e.target && e.target.tagName === "BUTTON")) { const p = primaryButton(); if (p) { if (c === "Space" && e.preventDefault) e.preventDefault(); p.click ? p.click() : act(p.dataset.act, p.dataset.v); } }
  else if (c === "Backspace" && ui.modal) { act("closemodal"); }
});

/* ---- loop ---- */
let paused = false;                         // tab hidden / ad open: stop drawing and ticking; flights keep real time
const holds = new Set();                    // reasons for the pause: "tab", "ad" (a portal build may add its own)
let extMute = false;                        // a portal build sets this when the platform turns sound off
function syncAudio() { audio.setHidden(holds.size > 0 || extMute); }
function setHold(why, on) {
  const was = holds.size > 0;
  if (on) holds.add(why); else holds.delete(why);
  syncAudio();
  if (holds.size) { paused = true; if (!was && st) save(); return; }      // saving here keeps lastSeen fresh for the clock-back guard
  if (!was || !paused) return;
  paused = false;
  fixClock(st, now()); save(); guideSync(); render(); requestAnimationFrame(frame);   // catch up: a flight may have landed while away
}
function frame() {
  if (paused) return;
  const t = performance.now() / 1000;
  for (const el of animEls) if (el.isConnected) paintCanvas(el, t);
  requestAnimationFrame(frame);
}
function tick() {
  if (paused) return;
  const n = now();
  if (st.flight && (n < st.lastSeen - CLOCK_SLACK || st.flight.start > n + CLOCK_SLACK)) { fixClock(st, n); save(); render(); return; }
  st.lastSeen = n; if (n - lastSavedAt > 60000) save();
  const hw = $("#howto"); if (hw && hw.innerHTML && !howtoHtml()) hw.innerHTML = "";
  const f = st.flight;
  if (ui.wasFlying && f && n >= f.endAt) { audio.sfx("home"); if (!ui.modal) { ui.celebrate = true; render(); } return; }
  if (f && n < f.endAt) {
    const tm = $("#timer"), pg = $("#prog"), sp = $("#sprog"), stt = $("#stime");
    if (tm) tm.textContent = STR.home + " " + fmt(f.endAt - n);
    const pct = Math.min(100, (n - f.start) / (f.endAt - f.start) * 100) + "%";
    if (pg) pg.style.width = pct;
    if (sp) sp.style.width = pct;
    if (stt) stt.textContent = fmt(f.endAt - n);
  }
}
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => setHold("tab", document.hidden));
if (typeof window !== "undefined" && window.addEventListener) window.addEventListener("pagehide", () => { if (st) save(); });

/* icon: a small teal tile with a coral kite, drawn in code and set as the page icon */
try {
  const ic = document.createElement("canvas"); ic.width = ic.height = 64; const g = ic.getContext("2d");
  g.fillStyle = "#2f8f8b"; g.fillRect(0, 0, 64, 64);
  g.fillStyle = "#ff7a59"; g.beginPath(); g.moveTo(32, 8); g.lineTo(50, 30); g.lineTo(32, 46); g.lineTo(14, 30); g.closePath(); g.fill();
  g.strokeStyle = "#fff6e0"; g.lineWidth = 3; g.beginPath(); g.moveTo(32, 8); g.lineTo(32, 46); g.moveTo(14, 30); g.lineTo(50, 30); g.stroke();
  g.beginPath(); g.moveTo(32, 46); g.quadraticCurveTo(24, 52, 32, 56); g.quadraticCurveTo(40, 60, 32, 62); g.stroke();
  const lk = document.createElement("link"); lk.rel = "icon"; lk.href = ic.toDataURL("image/png"); document.head.appendChild(lk);
} catch (e) {}
PORTAL.loadingStart();
load(); render(); requestAnimationFrame(frame);
{ const ld = $("#loading"); if (ld) ld.className = "done"; setTimeout(() => { if (ld && ld.remove) ld.remove(); }, 400); }
PORTAL.loadingStop();
if (document.hidden) { holds.add("tab"); paused = true; } else PORTAL.gameplayStart();
})();
</script>
