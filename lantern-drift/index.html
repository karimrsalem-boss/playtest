<style>

html,body{margin:0;height:100%;background:#140f2e;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff4e0;user-select:none;-webkit-user-select:none;touch-action:pan-y pinch-zoom}

<script>
'use strict';
/* ====================================================================
   Lantern Drift v1 — one file. Layers (so v2 can swap the bots for a network):
   STR/CFG/SHAPES  data
   Sim             authoritative game rules (no DOM, no drawing)
   Drivers         turn a source of intent into inputs[playerId] = {ax,ay,pulse,dim}
                   BotDriver (v1, simulated players), HumanDriver (local player).
                   A NetDriver in v2 fills inputs for remote players with the same contract.
   Renderer / UI   canvas drawing, DOM screens
   ==================================================================== */

/* ---------- strings: all player-facing words live here ---------- */
const STR = {
  title: 'Lantern Drift', tagline: 'Link lanterns. Draw the stars.',
  play: 'Play', customise: 'Lanterns', customTitle: 'Make it yours', pattern: 'Pattern', colour: 'Colour', skyline: 'Night city', wantedSet: 'Wanted shapes', done: 'Done',
  surprise: 'Surprise me', rotate: 'Rotate nightly', paused: 'Paused', resume: 'Resume', soundOn: 'Sound: on', soundOff: 'Sound: off', pauseBtn: 'Pause', muteBtn: 'Mute',
  hintPause: 'P or the pause button pauses. Your round waits for you.', tonight: 'Tonight', setWord: 'Set',
  howLink: 'Drift close to link', howPulse: 'Pulse calls', howDim: 'Dim holds a link',
  hintKeys: 'Drag or arrows / WASD to drift. Space = pulse. E or Shift = dim. P = pause.',
  hintMove: 'Drag to drift', menu: 'Menu', goalLink: 'Drift close to a lantern', goalAdd: 'Add one more lantern', goalFit: 'Shape it like the card', goalHold: 'Hold still...', goalBig: 'Too many - a thread will let go', goalTime: 'Reach the dawn with the most Glow', glow: 'Glow', pulse: 'Pulse', dim: 'Dim',
  dawn: 'Dawn! Wanted shapes pay double', sunrise: 'Sunrise',
  bestConstellation: 'Best constellation', bestAssist: 'Best assist', mostSparks: 'Most sparks',
  you: 'You', playAgain: 'Play again', savePostcard: 'Save postcard',
  hangBanner: 'Hang your best constellation',
  bannerHung: 'Banner hung. It will fly beneath your lantern.', noShape: 'Finish a constellation to hang one.',
  saveFail: 'Could not save the picture here.',
  loading: 'Lighting the lanterns...', loadFail: 'Something went wrong. Please reload the page.',
  adWait: 'Watch a short video to hang your banner.', adFail: 'No video is available right now. Try again later.', setNext: 'Your chosen shapes come in round two.',
  canvasLabel: 'Lantern Drift play area. Use the buttons for pause, sound, pulse and dim. Shapes you lock are announced here.',
  aLock: 'Shape locked: ', aDawn: 'Dawn. Wanted shapes pay double.', aWanted: 'Wanted: ', aPlaying: 'Round started. ', aPaused: 'Paused.',
  none: '-', rank: 'Your rank in the practice crew', crewNote: 'Your practice crew is made of computer lanterns.', nudge: 'Tip: Pulse calls nearby lanterns, Dim holds a link', postcardTitle: 'My sky',
  shapes: { pair: 'Pair', line: 'Bridge', tri: 'Triangle', spoke: 'Spoke', square: 'Square', vee: 'Corner', zig: 'Zigzag', ell: 'Hook', comet: 'Comet' },
  patterns: ['Plain', 'Stripes', 'Dots', 'Stars', 'Waves', 'Diamonds'],
  colours: ['Gold', 'Mint', 'Plum', 'Coral', 'Sky', 'Rose', 'Lilac', 'Lime', 'Teal', 'Peach', 'Cloud', 'Amber']
};
const BOT_NAMES = ['Wick', 'Pip', 'Moth', 'Ember', 'Fig', 'Dusk', 'Nim', 'Lark', 'Tam', 'Juno', 'Oat'];

/* ---------- config ---------- */
const CFG = {
  worldW: 1000, worldH: 1500, duration: 180, dawnAt: 150, players: 12,
  lanternR: 22, touchDist: 56, linkMax: 320, linkLife: 18, maxDeg: 3,
  settle: 0.8, settleDecay: 0.4, tol: 0.3, sMin: 30, sMax: 260,
  accel: 420, maxSpeed: 170, pulseCd: 6, pulseRange: 420, dimDur: 6, dimCd: 9,
  ember: 3, pairCd: 6, sparkCount: 30, sparkR: 30, wantedSlots: 3, ground: 150, step: 1 / 60
};

/* Wanted shapes. pts are relative; edges are the threads that must exist. Matching is
   by pair distances up to scale, so rotation, mirroring and size are free and tracing may be loose. */
const SHAPES = {
  pair:   { n: 2, pts: [[0, 0], [1, 0]], edges: [[0, 1]], value: 4, w: 18 },
  line:   { n: 3, pts: [[0, 0], [1, 0], [2, 0]], edges: [[0, 1], [1, 2]], value: 8, w: 20 },
  tri:    { n: 3, pts: [[0, 0], [1, 0], [.5, .866]], edges: [[0, 1], [1, 2], [2, 0]], value: 10, w: 20 },
  spoke:  { n: 4, pts: [[0, 0], [1, 0], [-.5, .866], [-.5, -.866]], edges: [[0, 1], [0, 2], [0, 3]], value: 16, w: 24 },
  square: { n: 4, pts: [[0, 0], [1, 0], [1, 1], [0, 1]], edges: [[0, 1], [1, 2], [2, 3], [3, 0]], value: 18, w: 26 },
  vee:    { n: 3, pts: [[0, 0], [1, 0], [1, 1]], edges: [[0, 1], [1, 2]], value: 8, w: 18, tol: .14 },   // tighter, so a straight bridge is not also a corner
  zig:    { n: 4, pts: [[0, 0], [1, 0], [1, 1], [2, 1]], edges: [[0, 1], [1, 2], [2, 3]], value: 14, w: 22, bend: 'zig' },
  ell:    { n: 4, pts: [[0, 0], [0, 1], [0, 2], [1, 2]], edges: [[0, 1], [1, 2], [2, 3]], value: 14, w: 22, bend: 'ell' },
  comet:  { n: 4, pts: [[0, 0], [1, 0], [.5, .866], [-.9, -.4]], edges: [[0, 1], [1, 2], [2, 0], [0, 3]], value: 20, w: 24 }
};
/* Eight wanted-shape sets. Each night uses one: the three cards you start with are 2-3 lantern shapes (start),
   later cards are drawn from start + more. The guided first round always uses its own starters. */
const SETS = [
  { name: 'First Lights',  start: ['pair', 'line', 'tri'],   more: ['spoke', 'square'] },
  { name: 'Little Bridges', start: ['line', 'vee', 'pair'],  more: ['zig', 'ell'] },
  { name: 'Quiet Corners', start: ['vee', 'tri', 'pair'],    more: ['square', 'comet'] },
  { name: 'Comet Night',   start: ['tri', 'pair', 'vee'],    more: ['comet', 'spoke'] },
  { name: 'Garden Paths',  start: ['line', 'tri', 'vee'],    more: ['zig', 'ell', 'square'] },
  { name: 'Festival',      start: ['pair', 'tri', 'line'],   more: ['spoke', 'square', 'zig'] },
  { name: 'Whisper Walk',  start: ['vee', 'line', 'pair'],   more: ['ell', 'comet'] },
  { name: 'Grand Lantern', start: ['tri', 'line', 'vee'],    more: ['spoke', 'square', 'zig', 'ell', 'comet'] }
];
const GUIDED_START = ['line', 'tri', 'spoke'];   // the guided pocket is you + 3 friends, so a 4-lantern card keeps a full pocket a valid shape
const PALETTE = ['#ffd166', '#7fe3c0', '#b06ab3', '#ffb3a0', '#8fb8ff', '#ff8fb0', '#c3a6ff', '#c8e88a', '#5fd0d8', '#ff9272', '#f4e9ff', '#ff9f43'];

(function prepShapes() {
  for (const k in SHAPES) {
    const s = SHAPES[k], n = s.n;
    s.adj = Array.from({ length: n }, () => Array(n).fill(0));
    s.dist = Array.from({ length: n }, () => Array(n).fill(0));
    for (const [a, b] of s.edges) s.adj[a][b] = s.adj[b][a] = 1;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) s.dist[i][j] = Math.hypot(s.pts[i][0] - s.pts[j][0], s.pts[i][1] - s.pts[j][1]);
  }
})();
const PERMS = {};
function perms(n) {
  if (PERMS[n]) return PERMS[n];
  const out = [], a = [...Array(n).keys()];
  (function rec(k) { if (k === n) { out.push(a.slice()); return; } for (let i = k; i < n; i++) { [a[k], a[i]] = [a[i], a[k]]; rec(k + 1); [a[k], a[i]] = [a[i], a[k]]; } })(0);
  return PERMS[n] = out;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Bend check for the two 4-lantern paths, so a Hook is never a Zigzag: with the turn sines c1, c2 at the two inner lanterns,
   Zigzag turns both ways by a clear angle (c1*c2 < 0, both > .5); Hook goes nearly straight at one inner lantern and bends at the other. */
function bendOk(kind, o) {
  const cr = (a, b, c) => { const ux = b.x - a.x, uy = b.y - a.y, vx = c.x - b.x, vy = c.y - b.y; return (ux * vy - uy * vx) / ((Math.hypot(ux, uy) * Math.hypot(vx, vy)) || 1); };
  const c1 = cr(o[0], o[1], o[2]), c2 = cr(o[1], o[2], o[3]), a1 = Math.abs(c1), a2 = Math.abs(c2);
  return kind === 'zig' ? c1 * c2 < 0 && a1 > .5 && a2 > .5 : Math.min(a1, a2) < .5 && Math.max(a1, a2) > .5;
}

/* Best isomorphic fit of a linked group onto a shape: returns {shape, err, s, perm, ok} or null. */
function matchShape(key, nodes, edges) {
  const sh = SHAPES[key], n = nodes.length;
  if (n !== sh.n || edges.length !== sh.edges.length) return null;
  const idx = new Map(nodes.map((p, i) => [p.id, i]));
  const A = Array.from({ length: n }, () => Array(n).fill(0));
  for (const e of edges) { const i = idx.get(e.a), j = idx.get(e.b); A[i][j] = A[j][i] = 1; }
  const D = nodes.map(p => nodes.map(q => Math.hypot(p.x - q.x, p.y - q.y)));
  let best = null;
  outer: for (const pm of perms(n)) {
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (A[i][j] !== sh.adj[pm[i]][pm[j]]) continue outer;
    if (sh.bend) { const o = []; for (let i = 0; i < n; i++) o[pm[i]] = nodes[i]; if (!bendOk(sh.bend, o)) continue; }
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { const t = sh.dist[pm[i]][pm[j]]; num += D[i][j] * t; den += t * t; }
    const s = num / den; if (!(s > 0)) continue;
    let err = 0, c = 0;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { const t = sh.dist[pm[i]][pm[j]] * s; err += Math.abs(D[i][j] - t) / t; c++; }
    err /= c;
    if (!best || err < best.err) best = { shape: key, err, s, perm: pm.slice(), idx };
  }
  if (best) best.ok = best.err < (sh.tol || CFG.tol) && best.s >= CFG.sMin && best.s <= CFG.sMax;
  return best;
}

/* ====================================================================
   Sim
   ==================================================================== */
class Sim {
  constructor(seed, humanId, opts) {
    this.rng = mulberry32(seed); this.humanId = humanId == null ? -1 : humanId;
    this.guided = !!(opts && opts.guided); this.duration = this.guided ? 90 : CFG.duration; this.dawnAt = this.guided ? 70 : CFG.dawnAt; this.linkLife = this.guided ? 40 : CFG.linkLife;
    this.setNo = opts && opts.set != null ? opts.set % SETS.length : 0; this.set = SETS[this.setNo]; this.pool = this.set.start.concat(this.set.more);
    this.dt = CFG.step;
    this.inviteUntil = this.humanId >= 0 ? (this.guided ? 1e9 : 30) : 0;   // first-round bots invite the player
    this.t = 0; this.over = false; this.dawn = false;
    this.players = []; this.sparks = []; this.gusts = []; this.links = []; this.locked = [];
    this.wanted = []; this.events = []; this.pulseLog = []; this.settle = {}; this.comps = []; this.compOf = {}; this.cool = {};
    for (let i = 0; i < CFG.players; i++) this.players.push(this.makePlayer(i));
    for (let i = 0; i < CFG.sparkCount; i++) this.sparks.push(this.newSpark());
    for (let i = 0; i < 5; i++) this.gusts.push({ x: this.r(100, CFG.worldW - 100), y: this.r(150, CFG.worldH - 300), r: this.r(150, 230), a: this.r(0, 6.28), s: this.r(110, 170), vx: this.r(-14, 14), vy: this.r(-14, 14), spin: this.r(-.25, .25) });
    for (const shape of this.set.start.slice(0, CFG.wantedSlots)) { this.wanted.push({ shape }); this.rng(); }
    this.helperIds = this.humanId >= 0 ? this.players.filter(p => p.id !== this.humanId).slice(0, 3).map(p => p.id) : [];

  }
  /* guided first round: you in the middle, three friendly lanterns near, the rest far away */
  placeGuided() {
    const me = this.players[this.humanId]; me.x = CFG.worldW / 2; me.y = 800; me.vx = me.vy = 0;
    const help = this.players.filter(p => p.id !== this.humanId).slice(0, 3), far = this.players.filter(p => p.id !== this.humanId).slice(3);
    help.forEach((p, i) => { const a = [1.2, 3.9, 5.5][i]; p.x = me.x + Math.cos(a) * 250; p.y = me.y + Math.sin(a) * 250; });
    for (const p of far) while (Math.hypot(p.x - me.x, p.y - me.y) < 480) { p.x = this.r(80, CFG.worldW - 80); p.y = this.r(120, CFG.worldH - CFG.ground - 40); }
  }
  r(a, b) { return a + (b - a) * this.rng(); }
  makePlayer(i) {

      x: this.r(80, CFG.worldW - 80), y: this.r(120, CFG.worldH - CFG.ground - 40), vx: 0, vy: 0, tint: PALETTE[i % PALETTE.length], pat: i === this.humanId ? 0 : (i * 5) % 7 % 6,

  newSpark() { return { x: this.r(40, CFG.worldW - 40), y: this.r(60, CFG.worldH - CFG.ground - 20), ph: this.r(0, 6.28) }; }
  pickShape() {
    const taken = new Set(this.wanted.map(w => w.shape)), keys = this.pool.filter(k => !taken.has(k));

  }

  step(dt, inputs) {
    if (this.over) return;

    if (!this.dawn && this.t >= this.dawnAt) { this.dawn = true; this.events.push({ type: 'dawn' }); }
    if (this.t >= this.duration) { this.over = true; this.events.push({ type: 'end' }); return; }
    for (const g of this.gusts) {
      g.x += g.vx * dt; g.y += g.vy * dt; g.a += g.spin * dt;
      if (g.x < 50 || g.x > CFG.worldW - 50) g.vx = -g.vx;

    }

        this.events.push({ type: 'pulse', x: p.x, y: p.y, id: p.id });

      const dimmed = p.dimT > 0;
      let ax = dimmed ? 0 : inp.ax * CFG.accel * p.speedMul, ay = dimmed ? 0 : inp.ay * CFG.accel * p.speedMul;
      for (const g of this.gusts) {

      if (p.y < 40) { p.y = 40; p.vy = Math.abs(p.vy) * .4; } if (p.y > yMax) { p.y = yMax; p.vy = -Math.abs(p.vy) * .4; }

  }

  stepLinks(dt) {
    const P = this.players, T2 = CFG.touchDist ** 2;
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const a = P[i], b = P[j], dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy > T2 || a.ember > 0 || b.ember > 0) continue;
      if (this.quarantined() && this.circle(a.id) !== this.circle(b.id)) continue;
      const key = a.id + '-' + b.id, ex = this.findLink(a.id, b.id);

      if ((this.cool[key] || 0) > this.t || this.deg(a.id) >= CFG.maxDeg || this.deg(b.id) >= CFG.maxDeg) continue;

      this.links.push({ a: a.id, b: b.id, born: this.t, exp: this.t + this.linkLife, by: ra >= rb ? a.id : b.id });
      this.events.push({ type: 'link', x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, a: a.id, b: b.id });
    }

      const a = this.players[l.a], b = this.players[l.b];
      if (a.dimT > 0 || b.dimT > 0) l.exp = Math.max(l.exp, this.t + 1);
      return Math.hypot(a.x - b.x, a.y - b.y) <= CFG.linkMax && this.t < l.exp;

  buildComps() {
    const par = this.players.map((_, i) => i), find = x => par[x] === x ? x : (par[x] = find(par[x]));
    for (const l of this.links) par[find(l.a)] = find(l.b);

        const A = SHAPES[m.shape], B = c.m && SHAPES[c.m.shape], sameGraph = B && A.n === B.n && A.edges.length === B.edges.length;

     Guided round: after 2.5 s for any group of 3+. Normal rounds: after 5 s, and only when the group cannot grow into
     a wanted shape (4+ lanterns, or 3 lanterns while no wanted shape has 4). */
  unhook() {

    this.wanted = this.wanted.filter(w => w !== slot); slot.shape = this.pickShape(); this.wanted.push(slot);

}

function computeAwards(sim) {
  const ps = sim.players.slice().sort((a, b) => b.glow - a.glow);
  let best = null;
  for (const r of sim.locked) if (!best || r.value > best.value || (r.value === best.value && r.n > best.n)) best = r;
  const top = (key) => { let w = null; for (const p of sim.players) if (p[key] > 0 && (!w || p[key] > w[key] || (p[key] === w[key] && p.glow > w.glow))) w = p; return w; };
  return { ps, best, assist: top('assists'), sparks: top('sparks') };
}

/* ====================================================================
   Drivers
   ==================================================================== */
class BotDriver {
  constructor() { this.b = {}; this.seen = -1; }
  collect(sim, dt, inputs) {
    const pulses = sim.pulseLog.filter(p => p.t > this.seen);
    if (pulses.length) this.seen = Math.max(...pulses.map(p => p.t));
    const P = sim.players, t = sim.t, rnd = () => sim.rng();
    const inv = sim.humanId >= 0 && t < sim.inviteUntil, hp = inv ? P[sim.humanId] : null;
    const helpers = inv ? sim.helperIds : [];
    for (const p of P) {
      if (p.id === sim.humanId) continue;
      p.inviting = false;
      if (hp && sim.quarantined() && !helpers.includes(p.id)) {   // keep clear of the guided pocket
        const fx = p.x - hp.x, fy = p.y - hp.y, fd = Math.hypot(fx, fy) || 1;
        if (fd < 420) { const ex = fx / fd, ey = fy / fd; inputs[p.id] = { ax: ex, ay: ey, pulse: false, dim: false }; continue; }
      }
      const b = this.b[p.id] || (this.b[p.id] = { mode: 'wander', until: 0, tx: p.x, ty: p.y, target: -1, nextPulse: t + 4 + rnd() * 12 });
      const comp = sim.compOf[p.id];
      let ax = 0, ay = 0, pulse = false, dim = false, forced = false;
      for (const pl of pulses) {
        if (pl.id === p.id || b.mode === 'form') continue;
        if (Math.hypot(pl.x - p.x, pl.y - p.y) < CFG.pulseRange && rnd() < .65) { b.mode = 'follow'; b.target = pl.id; b.until = t + 4; }
      }
      if (comp && comp.m) {
        if (comp.m.ok) { forced = true; }                       // hold still while the shape settles
        else {                                                  // right threads, loose geometry: relax into the shape
          const s0 = clamp(comp.m.s, 110, 200), sh = SHAPES[comp.m.shape], i = comp.m.idx.get(p.id);
          for (let j = 0; j < comp.nodes.length; j++) if (j !== i) {
            const q = comp.nodes[j], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1;
            const want = s0 * sh.dist[comp.m.perm[i]][comp.m.perm[j]], k = (d - want) / s0;
            ax += dx / d * k; ay += dy / d * k;
          }
          b.mode = 'form'; b.until = t + .5; forced = true;
        }
      }
      const hi = helpers.indexOf(p.id);
      if (!forced && hi >= 0 && p.ember <= 0) {                // invite: hover near the player, wait to be touched
        forced = true; p.inviting = !sim.findLink(p.id, hp.id);
        let an = b.anchor;
        if (!an || Math.hypot(an.x - hp.x, an.y - hp.y) > 300) { const ang = hi * 2.1 + 1.2 + (rnd() - .5) * .6; an = b.anchor = { x: clamp(hp.x + Math.cos(ang) * 170, 60, CFG.worldW - 60), y: clamp(hp.y + Math.sin(ang) * 170, 80, CFG.worldH - CFG.ground - 20) }; }
        const dx = an.x - p.x, dy = an.y - p.y, d = Math.hypot(dx, dy);
        if (d > 14) { const mag = clamp(d / 70, 0, 1); ax = dx / d * mag; ay = dy / d * mag; }
      }
      if (!forced) {
        if (b.mode === 'form') b.until = 0;
        // path of n lantern with a wanted cycle of the same size: the two ends reach for each other
        const closer = comp && !comp.m && this.closeTarget(sim, comp, p);
        if (closer != null) { b.mode = 'follow'; b.target = closer; b.until = t + 1; }
        else if (t > b.until) this.pick(sim, p, b, comp);
        let tx = b.tx, ty = b.ty;
        if (b.mode === 'spark') { let bd = 1e9; for (const s of sim.sparks) { const d = (s.x - p.x) ** 2 + (s.y - p.y) ** 2; if (d < bd) { bd = d; tx = s.x; ty = s.y; } } }
        else if (b.mode === 'follow' || b.mode === 'friend') {
          const o = P[b.target]; if (!o) b.until = 0; else { tx = o.x; ty = o.y; if (sim.findLink(p.id, o.id)) b.until = 0; }
        }
        const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
        if (d > 18) { ax = dx / d; ay = dy / d; const w = Math.sin(t * 1.3 + p.id * 2) * .3; ax += -dy / d * w; ay += dx / d * w; }
        else if (b.mode === 'wander') b.until = 0;
        if (comp && !comp.m && p.dimCd <= 0 && comp.nodes.length >= 2 && rnd() < .02 * dt * 60 / 10) dim = true;
        if (t > b.nextPulse && !comp) { pulse = true; b.nextPulse = t + 10 + rnd() * 14; }
      }
      const m = Math.hypot(ax, ay); if (m > 1) { ax /= m; ay /= m; }
      inputs[p.id] = { ax, ay, pulse, dim };
    }
  }
  closeTarget(sim, comp, p) {
    const n = comp.nodes.length; if (n < 3 || comp.edges.length !== n - 1) return null;
    if (!sim.wanted.some(w => SHAPES[w.shape].n === n && SHAPES[w.shape].edges.length === n)) return null;
    const ends = comp.nodes.filter(q => sim.deg(q.id) === 1);
    if (ends.length !== 2 || sim.deg(p.id) !== 1) return null;
    return ends[0].id === p.id ? ends[1].id : ends[0].id;
  }
  pick(sim, p, b, comp) {
    const t = sim.t, rnd = () => sim.rng(), P = sim.players;
    const others = P.filter(o => o.id !== p.id && o.ember <= 0 && sim.deg(o.id) < CFG.maxDeg && !sim.findLink(p.id, o.id) && !(comp && comp.ids.includes(o.id)));
    others.sort((a, c) => ((a.x - p.x) ** 2 + (a.y - p.y) ** 2) - ((c.x - p.x) ** 2 + (c.y - p.y) ** 2));
    const x = rnd();
    if (comp && comp.nodes.length < 4 && x < .7 && others.length) { b.mode = 'friend'; b.target = others[Math.floor(rnd() * Math.min(3, others.length))].id; }
    else if (x < .4) b.mode = 'spark';
    else if (x < .85 && others.length) { b.mode = 'friend'; b.target = others[Math.floor(rnd() * Math.min(4, others.length))].id; }
    else { b.mode = 'wander'; b.tx = 60 + rnd() * (CFG.worldW - 120); b.ty = 100 + rnd() * (CFG.worldH - CFG.ground - 160); }
    b.until = t + 2 + rnd() * 2.5;
  }
}

class HumanDriver {
  constructor(view) { this.view = view; this.keys = new Set(); this.steer = null; this.pulse = false; this.dim = false; }
  collect(sim, dt, inputs) {
    const p = sim.players[sim.humanId]; if (!p) return;
    let ax = 0, ay = 0; const k = this.keys;
    if (k.has('ArrowLeft') || k.has('KeyA')) ax -= 1; if (k.has('ArrowRight') || k.has('KeyD')) ax += 1;
    if (k.has('ArrowUp') || k.has('KeyW')) ay -= 1; if (k.has('ArrowDown') || k.has('KeyS')) ay += 1;
    const m = Math.hypot(ax, ay); if (m > 1) { ax /= m; ay /= m; }
    if (this.steer) {
      const w = this.view.toWorld(this.steer.x, this.steer.y), dx = w.x - p.x, dy = w.y - p.y, d = Math.hypot(dx, dy);
      if (d > 6) { const mag = clamp(d / 60, 0, 1); ax = dx / d * mag; ay = dy / d * mag; }
    }
    inputs[p.id] = { ax, ay, pulse: this.pulse, dim: this.dim }; this.pulse = this.dim = false;
  }
}

/* First-session guide, one step at a time: 0 drift, 1 touch a lantern, 2 finish the wanted shape, 3 done.
   Wordless: the renderer shows a pulsing hand on target(). Steps are latched, so they never go back. */
class Tutorial {
  constructor(sim) { const h = sim.players[sim.humanId]; this.step = 0; this.moved = 0; this.lx = h.x; this.ly = h.y; this.at = 0; this.shape = sim.wanted[0].shape; }   // shape = the card step 2 points at
  update(sim, steering) {
    const h = sim.players[sim.humanId]; if (!h || this.step >= 3) return;
    if (steering) this.moved += Math.hypot(h.x - this.lx, h.y - this.ly);
    this.lx = h.x; this.ly = h.y;
    if (sim.links.some(l => l.a === h.id || l.b === h.id)) this.didLink = true;
    if (sim.locked.some(r => r.members.includes(h.id))) this.didLock = true;
    if (this.moved >= 40) this.didMove = true;
    if (sim.t - this.at < .7) return;                       // every hand stays up long enough to be seen
    const done = this.step === 0 ? this.didMove || this.didLink || this.didLock : this.step === 1 ? this.didLink || this.didLock : this.didLock;

/* ====================================================================

   Every call checks for window.CrazyGames.SDK at call time and does nothing when it is missing, so the game plays the same
   everywhere. To go live, the portal's own SDK script tag is added at upload time and `await SDK.init()` runs; nothing else changes.
