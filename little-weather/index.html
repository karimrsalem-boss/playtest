<script>
'use strict';
// ---------------------------------------------------------------- icon (drawn in code, no file)

// ---------------------------------------------------------------- portal hooks (stubs)
// CrazyGames SDK v3 hook points. The SDK is NOT bundled and nothing is loaded from the network: each call

const portal = {

  sdk() { try { return (window.CrazyGames && window.CrazyGames.SDK) || null; } catch (e) { return null; } },
  call(fn) { try { const s = this.sdk(); if (s) fn(s); } catch (e) { /* a portal error must never stop the game */ } },

  loadingStop() { this.call(s => s.game.loadingStop()); },

  happytime() { this.call(s => s.game.happytime()); },
  // "Dream of tomorrow" hint. Without a wired ad it is simply granted, as before (no ad, no reward gating).
  rewarded(onGranted, onFail) {
    const s = this.sdk();
    if (!this.adsEnabled || !s) { onGranted(); return; }

    const grant = () => { if (!done) { done = true; this.gameplayStart(); onGranted(); } };
    try {
      this.gameplayStop();
      s.ad.requestAd('rewarded', { adFinished: grant, adError: () => { if (!done) { done = true; this.gameplayStart(); if (onFail) onFail(); } }, adStarted: () => {} });
    } catch (e) { grant(); }

portal.loadingStart();
// ---------------------------------------------------------------- strings
const STR = {
  title: 'Little Weather',
  play: 'Play',
  levels: 'Levels',
  daily: 'Daily',
  hint: 'Show a hint',
  tomorrow: 'Come back tomorrow',
  start: 'Start'
};

//#core-start
// ---------------------------------------------------------------- core rules
// Tiles: 0 rain, 1 sun, 2 breeze, 3 frost.
// Cells: 0 empty, 1 stone, 2 puddle, 3 ice, seed = 4 + stage*2 + wet (stage 0..3).
// A day: breeze, then rain, then sun, then frost. Each tile acts on the first
// thing found going down its column. Two tiles fit above each column.
const RAIN = 0, SUN = 1, BREEZE = 2, FROST = 3;
const PHASE = [BREEZE, RAIN, SUN, FROST];
const NLEVELS = 60, PER_SEASON = 20;

function firstRow(g, cols, rows, c) {
  for (let r = 0; r < rows; r++) if (g[r * cols + c]) return r;
  return -1;
}
function applyTile(g, cols, rows, t, c) {
  const r = firstRow(g, cols, rows, c);
  if (r < 0) return -1;
  const i = r * cols + c, v = g[i];
  if (t === RAIN) {
    if (v >= 4) g[i] = v | 1;
  } else if (t === SUN) {
    if (v >= 4) { if (v & 1) g[i] = 4 + (Math.min(3, ((v - 4) >> 1) + 1) << 1); }
    else if (v === 2) g[i] = 0;
    else if (v === 3) g[i] = 2;
  } else if (t === BREEZE) {
    if (v !== 3 && c + 1 < cols && !g[i + 1]) { g[i + 1] = v; g[i] = 0; }
  } else if (t === FROST) {
    if (v === 2) g[i] = 3;
  }
  return r;
}
// placed: array per column of tile types (order inside a column does not matter)
function sim(cols, rows, g0, placed, rec) {
  const g = g0.slice();
  for (const ph of PHASE) for (let c = 0; c < cols; c++) {
    const col = placed[c];
    if (!col) continue;
    for (const t of col) if (t === ph) {
      const r = applyTile(g, cols, rows, t, c);
      if (rec) rec.push({ t, c, r, g: g.slice() });
    }
  }
  return g;
}
function same(a, b) {
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}
const OPTS = [[]];
for (let a = 0; a < 4; a++) OPTS.push([a]);
for (let a = 0; a < 4; a++) for (let b = a; b < 4; b++) OPTS.push([a, b]);

// Smallest set of tiles (within the inventory) that reaches the target.
// start = known solution so the search only looks for something smaller.
function solve(L, inv, start) {
  const cols = L.cols, rows = L.rows;
  let best = start.reduce((n, a) => n + a.length, 0), bestP = start;
  const cnt = inv.slice(), cur = [];
  let nodes = 0;
  (function dfs(c, used) {
    if (nodes > 250000) return;
    if (c === cols) {
      nodes++;
      if (used > 0 && used < best && same(sim(cols, rows, L.grid, cur), L.target)) {
        best = used; bestP = cur.map(x => x.slice());
      }
      return;
    }
    for (const o of OPTS) {
      if (used + o.length >= best) continue;
      let ok = true;
      for (const t of o) cnt[t]--;
      for (const t of o) if (cnt[t] < 0) ok = false;
      if (ok) { cur[c] = o; dfs(c + 1, used + o.length); }
      for (const t of o) cnt[t]++;
    }
    cur[c] = [];
  })(0, 0);
  return { n: best, placed: bestP };
}

function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function toSlots(placed, cols) {
  const s = [];
  for (let c = 0; c < cols; c++) { const p = placed[c] || []; s.push([p[0] === undefined ? -1 : p[0], p[1] === undefined ? -1 : p[1]]); }
  return s;
}
function authored(cols, rows, items, sol, inv) {
  const g = new Array(cols * rows).fill(0);
  items.forEach(([r, c, v]) => { g[r * cols + c] = v; });
  const placed = []; for (let c = 0; c < cols; c++) placed.push(sol[c] || []);
  const target = sim(cols, rows, g, placed);
  const par = placed.reduce((n, a) => n + a.length, 0);
  return { cols, rows, grid: g, target, inv, par, sol: toSlots(placed, cols), demo: true };
}
// Random garden from a seed; the target is made by playing a secret set of tiles,
// so every garden can be solved. The par is the smallest solution the solver finds.
function build(P, seed) {
  const rnd = mulberry(seed), ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const { cols, rows, types, k } = P;
  let best = null, any = null;
  for (let att = 0; att < 80; att++) {
    const g = new Array(cols * rows).fill(0);
    const cells = [...Array(cols * rows).keys()];
    for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; }
    let p = 0;
    for (let i = 0; i < P.seeds; i++) g[cells[p++]] = rnd() < 0.25 ? 5 : 4;
    for (let i = 0; i < P.stones; i++) g[cells[p++]] = 1;
    for (let i = 0; i < P.puddles; i++) g[cells[p++]] = 2;
    for (let i = 0; i < P.ices; i++) g[cells[p++]] = 3;
    const tiles = [];
    for (let i = 0; i < k; i++) tiles.push(types[ri(0, types.length - 1)]);
    if (P.must !== null && P.must !== undefined && !tiles.includes(P.must)) tiles[0] = P.must;
    const placed = Array.from({ length: cols }, () => []);
    for (const t of tiles) {
      const open = []; for (let c = 0; c < cols; c++) if (placed[c].length < 2) open.push(c);
      placed[open[ri(0, open.length - 1)]].push(t);
    }
    const target = sim(cols, rows, g, placed);
    if (same(target, g)) continue;
    const inv = [0, 0, 0, 0];
    tiles.forEach(t => inv[t]++);
    if (P.decoy && rnd() < 0.7) inv[types[ri(0, types.length - 1)]]++;
    const L = { cols, rows, grid: g, target, inv };
    const s = solve(L, inv, placed);
    L.par = s.n; L.sol = toSlots(s.placed, cols); L.demo = false;
    const usesMust = P.must === null || P.must === undefined || s.placed.some(a => a.includes(P.must));
    if (usesMust && (!best || s.n > best.par)) best = L;
    if (usesMust && s.n >= (P.minPar || Math.max(2, k - 1))) return L;
    if (!any) any = L;
  }
  return best || any;
}
function paramsFor(i) {
  const s = Math.floor(i / PER_SEASON), j = i % PER_SEASON;
  const rnd = mulberry(i * 31 + 7), ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const types = s === 0 ? [RAIN, SUN] : s === 1 ? [RAIN, SUN, BREEZE] : [RAIN, SUN, BREEZE, FROST];
  const cols = s === 0 ? (j < 6 ? 3 : j < 14 ? 4 : 5) : s === 1 ? (j < 8 ? 4 : 5) : 5;
  const rows = s === 0 ? 3 : 4;
  // v3 balance: the smallest par a level may have, by season and place in the season (was: par 1-2 turned up in season 3)
  const minPar = s === 0 ? (j < 6 ? 2 : j < 12 ? 3 : 4) : s === 1 ? (j < 5 ? 3 : 4) : (j < 6 ? 4 : 5);
  const k = Math.min(8, minPar + 2);
  return {
    cols, rows, types, k, minPar,
    seeds: Math.min(3, 1 + Math.floor(j / 8) + ri(0, 1)),
    stones: s === 0 ? (j >= 4 ? ri(0, 1) : 0) : 1 + ri(0, 1),
    puddles: j >= 3 || s > 0 ? ri(0, 1) + (s > 0 ? 0 : 0) : 0,
    ices: s === 2 ? ri(0, 1) : 0,
    must: s > 0 && j === 1 ? types[types.length - 1] : null,
    decoy: j >= 6
  };
}
function makeLevel(i) {
  const W_ = 5, B = 6, E = 5; // wet seed code is 5
  switch (i) {
    case 0: return authored(3, 3, [[2, 1, 4]], { 1: [RAIN] }, [1, 0, 0, 0]);
    case 1: return authored(3, 3, [[2, 0, 4], [2, 2, 4]], { 0: [RAIN, SUN], 2: [RAIN] }, [2, 1, 0, 0]);
    case 2: return authored(3, 3, [[2, 0, E]], { 0: [BREEZE], 1: [SUN] }, [0, 1, 1, 0]);
    case 20: return authored(4, 4, [[3, 0, E], [3, 3, 1]], { 0: [BREEZE], 1: [SUN] }, [0, 1, 1, 0]);
    case 40: return authored(5, 4, [[3, 1, 2], [3, 3, E]], { 1: [FROST], 3: [SUN] }, [0, 1, 0, 1]);
  }
  for (let n = 0; ; n++) { const L = build(paramsFor(i), i * 7919 + 13 + n * 101); if (L) return L; }
}
function dailySeed(dateStr) { return parseInt(dateStr, 10); }
function makeDaily(dateStr) {
  const seed = dailySeed(dateStr), rnd = mulberry(seed), ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const P = { cols: 5, rows: 4, types: [RAIN, SUN, BREEZE, FROST], k: ri(4, 5), seeds: ri(2, 3), stones: ri(1, 2), puddles: ri(0, 1), ices: ri(0, 1), must: null, decoy: true };
  for (let n = 0; ; n++) { const L = build(P, seed + n * 101); if (L) return L; }
}
//#core-end

// ---------------------------------------------------------------- save
const KEY = 'little-weather-v1';
let save = { unlocked: 0, stars: {}, daily: { date: '', stars: 0, tries: 3, extra: false }, mute: false, tut: {} };
function loadSave() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const o = JSON.parse(s);
      if (o && typeof o === 'object') {
        if (Number.isFinite(o.unlocked)) save.unlocked = Math.max(0, Math.min(NLEVELS - 1, o.unlocked | 0));
        if (o.stars && typeof o.stars === 'object') save.stars = o.stars;
        if (o.daily && typeof o.daily === 'object') save.daily = Object.assign(save.daily, o.daily);
        save.mute = !!o.mute;
        if (o.tut && typeof o.tut === 'object') save.tut = o.tut;
      }
    }
  } catch (e) { /* storage unavailable: play without saving */ }
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } }
function todayStr() { const d = new Date(); return String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); } // the player's local day
loadSave();

// ---------------------------------------------------------------- canvas
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, paper = null, paperSeason = -1, crect = null;
function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paper = null; crect = null;
}
window.addEventListener('resize', resize);
resize();

const INK = '#6b5a52', CREAM = '#fbf3e1';
const PET = ['#ffb3c1', '#ffd6a5', '#d7b8f3', '#b5e2fa', '#fff1a8'];
const TCOL = ['#d6ecfa', '#fff0b8', '#d9f3e8', '#e3efff'];
const SEASON_COL = ['#d9efc8', '#ffe9b5', '#f7cfd8'];
const SEASON_PAPER = ['#f5f4dd', '#fdeed0', '#f6ebee'], GARDEN_COL = ['#cfe8bf', '#e6e3b0', '#d9e3ee'];
// the season of the screen being shown: levels 1-20 spring rain, 21-40 summer breeze, 41-60 frost; the daily is a summer day
function curSeason() {
  if (screen === 'level' && lv) return lv.kind === 'level' ? Math.floor(lv.index / PER_SEASON) : 1;
  if (screen === 'map') return mapSeason;
  return Math.min(2, Math.floor(save.unlocked / PER_SEASON));
}

function makePaper(season) {
  const p = document.createElement('canvas');
  p.width = Math.max(1, Math.round(W * DPR)); p.height = Math.max(1, Math.round(H * DPR));
  const x = p.getContext('2d');
  x.scale(DPR, DPR);
  x.fillStyle = SEASON_PAPER[season] || CREAM; x.fillRect(0, 0, W, H);
  const r = mulberry(5 + season);
  for (let i = 0; i < 26; i++) { // season art: petals, warm light dots, snow
    const px = r() * W, py = r() * H, sz = 4 + r() * 7;
    if (season === 0) { x.fillStyle = 'rgba(255,179,193,0.30)'; x.beginPath(); x.ellipse(px, py, sz, sz * 0.55, r() * 3, 0, 7); x.fill(); }
    else if (season === 1) { x.fillStyle = 'rgba(255,214,120,0.28)'; x.beginPath(); x.arc(px, py, sz * 0.8, 0, 7); x.fill(); }
    else { x.fillStyle = 'rgba(255,255,255,0.75)'; x.beginPath(); x.arc(px, py, sz * 0.5, 0, 7); x.fill(); x.strokeStyle = 'rgba(156,195,238,0.35)'; x.lineWidth = 1; x.stroke(); }
  }
  for (let i = 0; i < 260; i++) {
    x.fillStyle = 'rgba(190,160,120,' + (0.03 + r() * 0.05) + ')';
    x.beginPath(); x.arc(r() * W, r() * H, 0.6 + r() * 1.6, 0, 7); x.fill();
  }
  const g = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.8);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(230,200,160,0.35)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  return p;
}

// ---------------------------------------------------------------- draw helpers
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, rot) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot || 0, 0, 7);
  ctx.fillStyle = fill; ctx.fill();
}
function text(t, x, y, size, col, align, weight) {
  ctx.font = (weight || '700') + ' ' + size + 'px "Trebuchet MS","Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = col || INK; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t, x, y);
}
function line(pts, col, w) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function star(x, y, r, lit, pop) {
  const s = r * (pop || 1);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? s * 0.48 : s;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = lit ? '#ffd24d' : 'rgba(180,165,150,0.35)'; ctx.fill();
  ctx.lineJoin = 'round'; ctx.strokeStyle = lit ? '#e8a93a' : 'rgba(150,135,120,0.4)'; ctx.lineWidth = 2; ctx.stroke();
}
function cloud(x, y, s, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x - s * 0.22, y, s * 0.2, 0, 7); ctx.arc(x + s * 0.05, y - s * 0.1, s * 0.25, 0, 7); ctx.arc(x + s * 0.3, y, s * 0.18, 0, 7); ctx.fill();
  rr(x - s * 0.42, y - s * 0.02, s * 0.9, s * 0.2, s * 0.1); ctx.fill();
}

function drawTile(t, x, y, s, time, alpha, bg) {
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  if (bg !== false) {
    rr(x, y, s, s, s * 0.24); ctx.fillStyle = TCOL[t]; ctx.fill();
    ctx.strokeStyle = 'rgba(107,90,82,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  }
  const cx = x + s / 2, cy = y + s / 2;
  if (t === SUN) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(time * 0.6);
    for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); line([[s * 0.27, 0], [s * 0.38, 0]], '#ffc94a', s * 0.06); }
    ctx.restore();
    circ(cx, cy, s * 0.21, '#ffd96b', '#f2b43c', 2);
    circ(cx - s * 0.07, cy - s * 0.03, s * 0.025, INK); circ(cx + s * 0.07, cy - s * 0.03, s * 0.025, INK);
    ctx.beginPath(); ctx.arc(cx, cy + s * 0.01, s * 0.07, 0.2, Math.PI - 0.2); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
  } else if (t === RAIN) {
    cloud(cx, cy - s * 0.12, s * 0.9, '#ffffff');
    for (let i = 0; i < 3; i++) {
      const k = (time * 0.9 + i / 3) % 1, dx = cx + (i - 1) * s * 0.2, dy = cy + s * 0.05 + k * s * 0.3;
      ctx.globalAlpha = (alpha === undefined ? 1 : alpha) * (1 - k * 0.7);
      ell(dx, dy, s * 0.035, s * 0.06, '#6fb7e6');
    }
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  } else if (t === BREEZE) {
    for (let i = 0; i < 3; i++) {
      const yy = cy + (i - 1) * s * 0.2, sh = Math.sin(time * 2.2 + i) * s * 0.04;
      ctx.beginPath(); ctx.moveTo(cx - s * 0.32 + sh, yy);
      ctx.bezierCurveTo(cx - s * 0.1, yy - s * 0.1, cx + s * 0.1, yy + s * 0.1, cx + s * 0.28 + sh, yy - s * 0.02);
      ctx.strokeStyle = '#7fcab0'; ctx.lineWidth = s * 0.05; ctx.lineCap = 'round'; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx + s * 0.28, cy - s * 0.02 - s * 0.05, s * 0.05, Math.PI * 0.5, Math.PI * 2); ctx.strokeStyle = '#7fcab0'; ctx.lineWidth = s * 0.04; ctx.stroke();
  } else if (t === FROST) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(time) * 0.2);
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      line([[0, 0], [s * 0.3, 0]], '#8fb8ee', s * 0.05);
      line([[s * 0.18, 0], [s * 0.26, s * 0.08]], '#8fb8ee', s * 0.035);
      line([[s * 0.18, 0], [s * 0.26, -s * 0.08]], '#8fb8ee', s * 0.035);
    }
    ctx.restore();
    circ(cx, cy, s * 0.05, '#ffffff');
  }
