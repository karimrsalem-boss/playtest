<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Game playtest - your opinion</title>
<style>
  :root { --bg:#fbf7ef; --card:#fff; --ink:#2a2420; --muted:#6b625a; --line:#e3dacb; --accent:#c8742b; --ok:#2f7d4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1a17; --card:#27231f; --ink:#f1ebe2; --muted:#b3a99c; --line:#3a342d; --accent:#e39a55; --ok:#6cc08f; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 system-ui,sans-serif }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px }
  h1 { font-size:24px; margin:0 0 4px } p.lead { color:var(--muted); margin:0 0 20px }
  .game { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:12px 0 }
  .game > label { display:flex; gap:10px; align-items:center; font-weight:600; cursor:pointer }
  .game > label input { width:22px; height:22px }
  .detail { display:none; margin-top:12px } .game.on .detail { display:block }
  .row { margin:10px 0 } .row span { display:block; color:var(--muted); font-size:15px; margin-bottom:6px }
  .pills { display:flex; flex-wrap:wrap; gap:8px }
  .pills button { min-width:44px; min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:22px;
    background:transparent; color:var(--ink); font:inherit; cursor:pointer }
  .pills button.sel { background:var(--accent); border-color:var(--accent); color:#fff }
  input[type=text] { width:100%; min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:8px;
    background:transparent; color:var(--ink); font:inherit }
  #send { width:100%; min-height:52px; margin-top:20px; border:0; border-radius:12px; background:var(--accent);
    color:#fff; font:600 18px system-ui,sans-serif; cursor:pointer }
  #send:disabled { opacity:.5 } #msg { margin-top:14px; min-height:24px } #msg.err { color:#c0392b } #msg.ok { color:var(--ok) }
</style>
</head>
<body>
<main>
  <h1>What did you think?</h1>
  <p class="lead">Tick the games you played. One minute, no name needed.</p>
  <div class="row"><span>You played on</span><div class="pills" data-name="device">
    <button type="button" data-v="phone">Phone</button><button type="button" data-v="tablet">Tablet</button><button type="button" data-v="pc">PC</button></div></div>
  <div id="games"></div>
  <button id="send" type="button">Send my answers</button>
  <div id="msg" role="status"></div>
</main>
<script>
const ENDPOINT = "https://studio-playtest-poll.dmk-studio.workers.dev/submit";
const GAMES = [["treasure-race","Treasure Race"],["inkwake-relay","Inkwake Relay"],["lantern-drift","Lantern Drift"],
  ["little-weather","Little Weather"],["kitewind-workshop","Kitewind Workshop"]];
const box = document.getElementById("games");
for (const [id, title] of GAMES) {
  box.insertAdjacentHTML("beforeend", `<div class="game" data-game="${id}">
    <label><input type="checkbox"> ${title}</label>
    <div class="detail">
      <div class="row"><span>Score</span><div class="pills" data-name="score">${[1,2,3,4,5].map(n=>`<button type="button" data-v="${n}">${n}</button>`).join("")}</div></div>
      <div class="row"><span>Would you play it again?</span><div class="pills" data-name="again"><button type="button" data-v="yes">Yes</button><button type="button" data-v="no">No</button></div></div>
      <div class="row"><span>Did it work on your device?</span><div class="pills" data-name="works"><button type="button" data-v="yes">Yes</button><button type="button" data-v="no">No</button></div></div>
      <div class="row"><span>One thing to fix (optional)</span><input type="text" maxlength="300" data-name="fix"></div>
    </div></div>`);
}
document.querySelectorAll(".game input[type=checkbox]").forEach(cb => cb.addEventListener("change", e =>
  e.target.closest(".game").classList.toggle("on", e.target.checked)));
document.addEventListener("click", e => {
  const b = e.target.closest(".pills button"); if (!b) return;
  b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b));
});
const pick = (root, name) => root.querySelector(`.pills[data-name="${name}"] .sel`)?.dataset.v || "";
const session = Math.random().toString(36).slice(2, 12);
document.getElementById("send").addEventListener("click", async () => {
  const msg = document.getElementById("msg"); msg.className = ""; msg.textContent = "";
  const answers = [...document.querySelectorAll(".game.on")].map(g => ({ game: g.dataset.game,
    score: Number(pick(g, "score")) || null, again: pick(g, "again"), works: pick(g, "works"),
    fix: g.querySelector('[data-name="fix"]').value.trim() }));
  if (!answers.length) { msg.className = "err"; msg.textContent = "Tick at least one game you played."; return; }
  if (answers.some(a => !a.score)) { msg.className = "err"; msg.textContent = "Give each ticked game a score from 1 to 5."; return; }
  const btn = document.getElementById("send"); btn.disabled = true;
  try {
    const r = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session, device: pick(document, "device"), answers }) });
    if (!r.ok) throw new Error(r.status);
    msg.className = "ok"; msg.textContent = "Thank you! Your answers were sent.";
  } catch (e) { msg.className = "err"; msg.textContent = "Could not send. Please try again in a minute."; btn.disabled = false; }
});
</script>
</body>
</html>
